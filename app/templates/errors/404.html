{% extends 'components/base.html' %}

{% block title %}404 Not Found{% endblock %}

{% block content %}
  <div class="card border-0 shadow-sm mx-auto text-center" style="max-width: 42rem;">
    <div class="card-body p-5">
      <span class="badge text-bg-secondary mb-3">404</span>
      <h1 class="h3 mb-3">Page not found</h1>
      <p class="text-body-secondary mb-4">The page or record you requested could not be found.</p>
      <a href="{{ url_for('main.index') }}" class="btn btn-primary">{{ t('common.home') }}</a>
    </div>
  </div>
{% endblock %}
