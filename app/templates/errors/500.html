{% extends 'components/base.html' %}

{% block title %}500 Server Error{% endblock %}

{% block content %}
  <div class="card border-0 shadow-sm mx-auto text-center" style="max-width: 42rem;">
    <div class="card-body p-5">
      <span class="badge text-bg-danger mb-3">500</span>
      <h1 class="h3 mb-3">Something went wrong</h1>
      <p class="text-body-secondary mb-4">An unexpected error occurred while processing your request.</p>
      <a href="{{ url_for('main.index') }}" class="btn btn-primary">{{ t('common.home') }}</a>
    </div>
  </div>
{% endblock %}
